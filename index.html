<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaming App</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:white;
}

.header{
background:#1a1a1a;
padding:15px;
text-align:center;
font-size:22px;
}

.container{
padding:15px;
padding-bottom:80px;
}

.balance-card{
background:#1f1f1f;
border-radius:12px;
padding:20px;
text-align:center;
margin-bottom:20px;
}

.balance{
font-size:28px;
margin:10px 0;
}

.actions{
display:flex;
gap:10px;
}

button{
flex:1;
padding:12px;
border:none;
border-radius:10px;
font-weight:bold;
}

.deposit{
background:#ff8c00;
color:white;
}

.withdraw{
background:#444;
color:white;
}

.games{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:15px;
}

.game-card{
background:#1f1f1f;
padding:18px;
border-radius:10px;
text-align:center;
}

.bonus{
margin-top:20px;
background:#1f1f1f;
padding:15px;
border-radius:10px;
}

.bonus button{
width:100%;
background:#ff8c00;
color:white;
margin-top:10px;
}

.footer{
position:fixed;
bottom:0;
width:100%;
background:#1a1a1a;
display:flex;
justify-content:space-around;
padding:10px 0;
}

.footer button{
background:none;
border:none;
color:white;
font-size:14px;
display:flex;
flex-direction:column;
align-items:center;
}

.footer button.active{
color:#ff8c00;
}

/* Deposit Popup */

.popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
justify-content:center;
align-items:center;
}

.popup-box{
background:#1f1f1f;
padding:20px;
border-radius:10px;
width:90%;
max-width:350px;
text-align:center;
}

.popup img{
width:180px;
margin:10px 0;
}

.popup input{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:8px;
}

.popup button{
margin-top:10px;
background:#ff8c00;
color:white;
width:100%;
}

</style>
</head>

<body>

<div class="header">Gaming App</div>

<div class="container">

<div class="balance-card">
<div>Wallet Balance</div>
<div class="balance">₹ <span id="balance">150</span></div>

<div class="actions">
<button class="deposit" onclick="openDeposit()">Deposit</button>
<button class="withdraw">Withdraw</button>
</div>
</div>

<div class="games">
<div class="game-card">Lottery</div>
<div class="game-card">Slots</div>
<div class="game-card">Sports</div>
<div class="game-card">Live Casino</div>
<div class="game-card">Crash</div>
<div class="game-card">Color Game</div>
</div>

<div class="bonus">
Daily Bonus
<button>Claim Reward</button>
</div>

</div>

<!-- Deposit Popup -->

<div class="popup" id="depositPopup">
<div class="popup-box">

<h3>Deposit</h3>

<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=randomupi@upi">

<p>UPI ID</p>
<b>randomupi@upi</b>

<input type="number" placeholder="Enter Amount">

<button onclick="submitDeposit()">Submit</button>
<button onclick="closeDeposit()" style="background:#444;">Close</button>

</div>
</div>

<!-- Bottom Menu -->

<div class="footer">

<button class="active">
🏠
<span>Home</span>
</button>

<button>
🎁
<span>Promotion</span>
</button>

<button>
💰
<span>Wallet</span>
</button>

<button>
👤
<span>Account</span>
</button>

</div>

<script>

function openDeposit(){
document.getElementById("depositPopup").style.display="flex"
}

function closeDeposit(){
document.getElementById("depositPopup").style.display="none"
}

function submitDeposit(){
alert("Payment Submitted (Demo)")
}

</script>

</body>
</html>
